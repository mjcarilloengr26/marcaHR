services:
  - type: web
    name: marca-hr-backend
    runtime: node
    # Data now lives in Supabase Postgres (see DATABASE_URL below), not on local
    # disk, so the free plan is sufficient — no persistent disk needed.
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
